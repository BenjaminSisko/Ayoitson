name: Claude Mention Responder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  claude:
    name: Claude responds to mentions
    if: |
      (github.event_name == 'issues' && (contains(format('{0}', github.event.issue.body), '@claude') || contains(format('{0}', github.event.issue.title), '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(format('{0}', github.event.comment.body), '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(format('{0}', github.event.comment.body), '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(format('{0}', github.event.review.body), '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read