name: Claude Issue Auto-Fix

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number for Claude to inspect and fix
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: claude-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Claude fixes issue
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == true ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude issue fixer
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
            ISSUE TITLE: ${{ github.event.issue.title }}
            ISSUE BODY: ${{ github.event.issue.body }}
            ISSUE AUTHOR: ${{ github.event.issue.user.login }}
            ISSUE AUTHOR ASSOCIATION: ${{ github.event.issue.author_association }}

            You are Claude Code running as an immediate issue-fix agent.

            Mission:
            1. Read repository guidance first: AGENTS.md, CLAUDE.md, README*, and relevant docs if present.
            2. Inspect the issue and the codebase.
            3. If the issue is actionable and safe, implement the smallest high-quality fix.
            4. Run the most relevant available tests or validation commands.
            5. Create a branch named claude/issue-${{ github.event.issue.number || inputs.issue_number }}-fix, commit the change, push it, and open a pull request against the default branch.
            6. Link the PR to the issue with `Fixes #${{ github.event.issue.number || inputs.issue_number }}` when the fix is intended to close it.
            7. Comment on the issue with the PR link, a short summary, and the tests run.

            If the issue is not actionable, unsafe, too broad, missing required context, or should not be changed automatically, do not make code changes. Instead, comment on the issue with a concise blocker summary and exactly what information is needed.

            Guardrails:
            - Never push directly to the default branch.
            - Never expose secrets or token values.
            - Do not make destructive changes.
            - Keep changes scoped to the issue.
            - Preserve user work and repository conventions.
            - If tests cannot be run, say why in the PR and issue comment.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"