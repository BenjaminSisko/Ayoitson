name: Claude Issue Auto-Fix

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number for Claude to inspect and fix
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: claude-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Claude fixes issue
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == true ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude issue fixer
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
            ISSUE TITLE: ${{ github.event.issue.title }}
            ISSUE BODY: ${{ github.event.issue.body }}
            ISSUE AUTHOR: ${{ github.event.issue.user.login }}
            ISSUE AUTHOR ASSOCIATION: ${{ github.event.issue.author_association }}

            You are Claude Code running as an immediate issue-fix agent.

            Mission:
            1. Read repository guidance first: AGENTS.md, CLAUDE.md, README*, and relevant docs if present.
            2. Inspect the issue and the codebase. If this run was started by workflow_dispatch and the issue title/body above are blank, use `gh issue view ${{ github.event.issue.number || inputs.issue_number }}` to load the issue before changing files.
            3. If the issue is actionable and safe, implement the smallest high-quality fix.
            4. Run the most relevant available tests or validation commands.
            5. Commit and push your changes to the Claude branch prepared for you by the action.
            6. Include `Fixes #${{ github.event.issue.number || inputs.issue_number }}` in your final PR body suggestion when the fix is intended to close it.
            7. Comment on the issue with a short summary and tests run.

            After your branch is pushed, the workflow will automatically open the pull request for you. Do not push directly to the default branch.

            If the issue is not actionable, unsafe, too broad, missing required context, or should not be changed automatically, do not make code changes. Instead, comment on the issue with a concise blocker summary and exactly what information is needed.

            Guardrails:
            - Never push directly to the default branch.
            - Never expose secrets or token values.
            - Do not make destructive changes.
            - Keep changes scoped to the issue.
            - Preserve user work and repository conventions.
            - If tests cannot be run, say why in the issue comment.
          claude_args: |
            --max-turns 20

      - name: Open pull request for Claude branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "No issue number supplied; skipping PR creation."
            exit 0
          fi

          branch="$(git ls-remote --heads origin "claude/issue-${ISSUE_NUMBER}-*" | awk '{print $2}' | sed 's#refs/heads/##' | sort | tail -n 1)"
          if [ -z "${branch}" ]; then
            echo "No Claude branch found for issue ${ISSUE_NUMBER}; skipping PR creation."
            exit 0
          fi

          existing_pr="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing_pr}" ]; then
            echo "PR already open for ${branch}: #${existing_pr}"
            exit 0
          fi

          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${branch}" --jq '.status')"
          if [ "${compare_status}" = "identical" ]; then
            echo "Claude branch ${branch} has no diff against ${BASE_BRANCH}; skipping PR creation."
            exit 0
          fi

          if [ -z "${ISSUE_TITLE}" ]; then
            ISSUE_TITLE="$(gh issue view "${ISSUE_NUMBER}" --json title --jq '.title')"
          fi

          pr_body="$(printf 'Fixes #%s\n\nThis PR was opened automatically after Claude pushed `%s`.\n\nReview before merge.' "${ISSUE_NUMBER}" "${branch}")"
          pr_url="$(gh pr create \
            --head "${branch}" \
            --base "${BASE_BRANCH}" \
            --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "${pr_body}")"

          gh issue comment "${ISSUE_NUMBER}" --body "Opened PR for Claude's branch: ${pr_url}"
          echo "Opened ${pr_url}"
